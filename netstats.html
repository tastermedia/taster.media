<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netstats - Taster Media</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="images/logo.webp" type="image/webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=43" />
  <style>
    .ns-wrap{max-width:1120px;margin:0 auto;padding:34px 20px 80px;}
    .ns-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px;}
    .ns-title{margin:0;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:2rem;background:linear-gradient(135deg,#cc88ff,#ff66ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
    .ns-sub{opacity:.6;font-size:.85rem;letter-spacing:.06em;margin:4px 0 0;}
    .ns-range{display:flex;align-items:center;gap:10px;}
    .ns-range label{font-family:'Rajdhani',sans-serif;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:#8000ff;font-weight:600;}
    .ns-range select{background:rgba(128,0,255,.08);border:1px solid rgba(128,0,255,.35);color:#fff;font-family:'Josefin Sans',sans-serif;font-size:.92rem;padding:8px 14px;border-radius:8px;cursor:pointer;outline:none;}
    .ns-range select:focus{border-color:#ff00ff;box-shadow:0 0 0 3px rgba(255,0,255,.15);}
    .metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:44px;}
    .metric-card{background:linear-gradient(180deg,rgba(128,0,255,.08),rgba(255,0,255,.03));border:1px solid rgba(128,0,255,.28);border-radius:14px;padding:22px 18px;text-align:center;box-shadow:0 4px 24px rgba(128,0,255,.08);}
    .metric-value{font-family:'Rajdhani',sans-serif;font-size:2.4rem;font-weight:700;line-height:1;background:linear-gradient(135deg,#cc88ff,#ff66ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em;}
    .metric-label{font-family:'Rajdhani',sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8000ff;margin-top:8px;}
    .ns-section{margin-bottom:44px;}
    .ns-section h3{font-family:'Rajdhani',sans-serif;font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;color:#8000ff;font-weight:600;margin:0 0 16px;padding-bottom:8px;border-bottom:1px solid rgba(128,0,255,.2);}
    .bar-row{display:grid;grid-template-columns:220px 1fr auto;align-items:center;gap:14px;padding:8px 0;font-family:'Josefin Sans',sans-serif;font-size:.88rem;}
    .bar-label{color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;}
    .bar-track{background:rgba(128,0,255,.08);border-radius:999px;height:10px;overflow:hidden;position:relative;}
    .bar-fill{height:100%;background:linear-gradient(90deg,#8000ff,#ff00ff);border-radius:999px;transition:width .6s ease;box-shadow:0 0 8px rgba(128,0,255,.4);}
    .bar-value{font-family:'Rajdhani',sans-serif;font-size:.85rem;font-weight:600;color:#cc88ff;letter-spacing:.03em;min-width:60px;text-align:right;}
    .ns-cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;}
    @media (max-width:720px){.ns-cols{grid-template-columns:1fr;} .bar-row{grid-template-columns:140px 1fr auto;}}
    .ns-timeseries{background:rgba(128,0,255,.04);border:1px solid rgba(128,0,255,.18);border-radius:14px;padding:20px;margin-bottom:44px;}
    .ns-timeseries svg{width:100%;height:220px;display:block;}
    .ns-empty{opacity:.6;font-size:.9rem;padding:12px 0;}
    .ns-error{background:rgba(255,80,80,.08);border:1px solid rgba(255,80,80,.4);color:#ffaaaa;padding:20px;border-radius:12px;font-family:monospace;font-size:.85rem;white-space:pre-wrap;}
    .ns-loading{text-align:center;padding:60px 20px;opacity:.6;font-family:'Rajdhani',sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem;}
    .ns-note{opacity:.5;font-size:.75rem;margin-top:24px;text-align:center;font-style:italic;}
    /* Login form */
    .ns-login{max-width:340px;margin:80px auto;background:rgba(128,0,255,.06);border:1px solid rgba(128,0,255,.28);border-radius:14px;padding:32px 28px;text-align:center;}
    .ns-login h3{font-family:'Rajdhani',sans-serif;font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;color:#8000ff;font-weight:600;margin:0 0 18px;}
    .ns-login input{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(128,0,255,.35);color:#fff;font-family:'Josefin Sans',sans-serif;font-size:.95rem;padding:10px 14px;border-radius:8px;outline:none;box-sizing:border-box;margin-bottom:12px;}
    .ns-login input:focus{border-color:#ff00ff;box-shadow:0 0 0 3px rgba(255,0,255,.15);}
    .ns-login button{width:100%;background:linear-gradient(135deg,#8000ff,#ff00ff);color:#fff;border:0;font-family:'Rajdhani',sans-serif;font-size:.85rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:11px;border-radius:8px;cursor:pointer;margin-top:4px;}
    .ns-login button:hover{opacity:.9;}
    .ns-login .err{color:#ffaaaa;font-size:.8rem;margin-bottom:12px;font-family:monospace;}
  </style>
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "ef2f5e083de545cfacd74a6c761ea8fe"}'></script>
</head>
<body>
  <div id="header-placeholder"></div>
  <script src="header.js"></script>

  <main class="ns-wrap">
    <div class="ns-head">
      <div>
        <h2 class="ns-title">Site Analytics</h2>
        <p class="ns-sub">Live traffic to taster.media · cookieless</p>
      </div>
      <div class="ns-range">
        <label for="rangeSel">Range</label>
        <select id="rangeSel">
          <option value="24h">Last 24 hours</option>
          <option value="week" selected>Last 7 days</option>
          <option value="30d">Last 30 days</option>
          <option value="year">Last year</option>
          <option value="all">All time</option>
        </select>
      </div>
    </div>

    <div id="content"><div class="ns-loading">Loading stats…</div></div>

    <p class="ns-note">Powered by Cloudflare Web Analytics. Numbers refresh every ~1 minute.</p>
  </main>

  <footer>
    <div class="footer-inner">
      <p class="footer-copy">© <span class="footer-year">2026</span> Taster Media</p>
    </div>
  </footer>

  <script>
    const API_BASE = 'https://delicate-rain-06f0taster-netstats-api.tastermedia.workers.dev';

    const contentEl = document.getElementById('content');
    const rangeSel = document.getElementById('rangeSel');
    const nf = new Intl.NumberFormat('en-US');

    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function niceReferrer(r){
      if (!r || r === '(direct)' || r === '') return 'Direct / typed URL';
      try {
        const u = new URL(r.startsWith('http') ? r : 'https://' + r);
        return u.hostname.replace(/^www\./,'') + (u.pathname !== '/' ? u.pathname : '');
      } catch { return r; }
    }

    function nicePath(p){
      if (!p) return '/';
      return p.length > 60 ? p.slice(0,57)+'…' : p;
    }

    function barBlock(items, labelKey, labelFmt, valueKey){
      if (!items || !items.length) return '<div class="ns-empty">No data for this range.</div>';
      const max = Math.max(...items.map(i=>i[valueKey]||0), 1);
      return items.slice(0,20).map(it=>{
        const label = labelFmt ? labelFmt(it[labelKey]) : (it[labelKey] || '(unknown)');
        const val = it[valueKey] || 0;
        const pct = Math.max(2, (val/max)*100);
        return `<div class="bar-row"><div class="bar-label">${esc(label)}</div><div class="bar-track"><div class="bar-fill" style="width:${pct.toFixed(1)}%"></div></div><div class="bar-value">${nf.format(val)}</div></div>`;
      }).join('');
    }

    function sparkline(series){
      if (!series || series.length < 2) return '';
      const w = 1000, h = 220, pad = 20;
      const max = Math.max(...series.map(p=>p.pageviews||0), 1);
      const xs = (i)=> pad + (w - 2*pad) * (i/(series.length-1));
      const ys = (v)=> h - pad - (h - 2*pad) * (v/max);
      const linePv = series.map((p,i)=> `${i===0?'M':'L'}${xs(i).toFixed(1)},${ys(p.pageviews||0).toFixed(1)}`).join(' ');
      const lineU  = series.map((p,i)=> `${i===0?'M':'L'}${xs(i).toFixed(1)},${ys(p.uniques||0).toFixed(1)}`).join(' ');
      const area = `${linePv} L${xs(series.length-1).toFixed(1)},${(h-pad).toFixed(1)} L${xs(0).toFixed(1)},${(h-pad).toFixed(1)} Z`;
      const firstTs = series[0].ts, lastTs = series[series.length-1].ts;
      const fmt = (t)=> t ? new Date(t).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',timeZone:'UTC'}) : '';
      return `
        <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <defs>
            <linearGradient id="pvArea" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#ff00ff" stop-opacity=".45"/>
              <stop offset="100%" stop-color="#8000ff" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="${area}" fill="url(#pvArea)"/>
          <path d="${linePv}" fill="none" stroke="#ff66ff" stroke-width="2.4"/>
          <path d="${lineU}"  fill="none" stroke="#cc88ff" stroke-width="1.6" stroke-dasharray="4 3"/>
          <text x="${pad}" y="${h-4}" fill="#888" font-size="11" font-family="monospace">${esc(fmt(firstTs))}</text>
          <text x="${w-pad}" y="${h-4}" fill="#888" font-size="11" font-family="monospace" text-anchor="end">${esc(fmt(lastTs))}</text>
          <text x="${w-pad}" y="14" fill="#ff66ff" font-size="11" font-family="monospace" text-anchor="end">— pageviews</text>
          <text x="${w-pad}" y="28" fill="#cc88ff" font-size="11" font-family="monospace" text-anchor="end">--- unique visitors</text>
        </svg>`;
    }

    function render(data){
      const t = data.totals || {};
      contentEl.innerHTML = `
        <div class="metrics-grid">
          <div class="metric-card"><div class="metric-value">${nf.format(t.uniques||0)}</div><div class="metric-label">Unique Visitors</div></div>
          <div class="metric-card"><div class="metric-value">${nf.format(t.visits||0)}</div><div class="metric-label">Visits</div></div>
          <div class="metric-card"><div class="metric-value">${nf.format(t.pageviews||0)}</div><div class="metric-label">Pageviews</div></div>
          <div class="metric-card"><div class="metric-value">${t.visits ? (t.pageviews/t.visits).toFixed(2) : '0.00'}</div><div class="metric-label">Pages / Visit</div></div>
        </div>

        <div class="ns-timeseries">
          <h3 style="margin:0 0 12px;font-family:'Rajdhani',sans-serif;font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;color:#8000ff;font-weight:600;">Traffic Over Time</h3>
          ${sparkline(data.series)}
        </div>

        <div class="ns-section">
          <h3>Top Pages</h3>
          ${barBlock(data.pages, 'path', nicePath, 'visits')}
        </div>

        <div class="ns-section">
          <h3>Where They Came From (Referrers)</h3>
          ${barBlock(data.referrers, 'referrer', niceReferrer, 'visits')}
        </div>

        <div class="ns-cols">
          <div class="ns-section">
            <h3>Top Countries</h3>
            ${barBlock(data.countries, 'country', null, 'visits')}
          </div>
          <div class="ns-section">
            <h3>Devices</h3>
            ${barBlock(data.devices, 'device', null, 'visits')}
          </div>
          <div class="ns-section">
            <h3>Browsers</h3>
            ${barBlock(data.browsers, 'browser', null, 'visits')}
          </div>
          <div class="ns-section">
            <h3>Operating Systems</h3>
            ${barBlock(data.os, 'os', null, 'visits')}
          </div>
        </div>
      `;
    }

    async function load(range){
      contentEl.innerHTML = '<div class="ns-loading">Loading stats…</div>';
      if (API_BASE.includes('PASTE_YOUR_WORKERS_SUBDOMAIN_HERE')) {
        contentEl.innerHTML = '<div class="ns-error">Set-up not complete.\n\nAfter running `wrangler deploy` in the /worker directory, paste the printed workers.dev URL into netstats.html\'s API_BASE constant.</div>';
        return;
      }
      const creds = sessionStorage.getItem('netstats.creds');
      if (!creds) { showLogin(); return; }
      try {
        const resp = await fetch(`${API_BASE}/query?range=${encodeURIComponent(range)}`, {
          headers: { 'Authorization': 'Basic ' + creds },
        });
        if (resp.status === 401) {
          sessionStorage.removeItem('netstats.creds');
          showLogin('Wrong password. Try again.');
          return;
        }
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        render(data);
      } catch (e) {
        contentEl.innerHTML = `<div class="ns-error">Failed to load stats.\n\n${esc(e.message)}</div>`;
      }
    }

    function showLogin(err){
      contentEl.innerHTML = `
        <div class="ns-login">
          <h3>Sign in</h3>
          ${err ? `<div class="err">${esc(err)}</div>` : ''}
          <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus />
          <button id="loginBtn">Enter</button>
        </div>`;
      const pw = document.getElementById('pw');
      const btn = document.getElementById('loginBtn');
      const submit = ()=>{
        const val = pw.value || '';
        if (!val) return;
        // Basic Auth: base64("username:password"). Username can be anything.
        sessionStorage.setItem('netstats.creds', btoa('admin:' + val));
        load(rangeSel.value);
      };
      btn.addEventListener('click', submit);
      pw.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') submit(); });
    }

    rangeSel.addEventListener('change', ()=> load(rangeSel.value));
    load(rangeSel.value);
  </script>
</body>
</html>
